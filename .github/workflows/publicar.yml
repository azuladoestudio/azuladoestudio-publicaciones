name: Publicar en Instagram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      probar:
        description: 'Solo probar (no publica)'
        type: boolean
        default: true

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar lo que toque
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841421840314407'
          IMG_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: node publicar.mjs ${{ inputs.probar && '--probar' || '' }}
      - name: Guardar el estado de la cola
        run: |
          git config user.name "Azulado Publicador"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cola.json imagenes
          git diff --cached --quiet || (git commit -m "Publicada en Instagram" && git push)
